<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BFA5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield background -->
  <path d="M100 10 L180 40 L180 100 Q180 160 100 190 Q20 160 20 100 L20 40 Z" fill="url(#grad)"/>
  <!-- Paw print -->
  <g fill="white">
    <!-- Main pad -->
    <ellipse cx="100" cy="115" rx="28" ry="24"/>
    <!-- Top left toe -->
    <ellipse cx="72" cy="72" rx="12" ry="14" transform="rotate(-20 72 72)"/>
    <!-- Top right toe -->
    <ellipse cx="128" cy="72" rx="12" ry="14" transform="rotate(20 128 72)"/>
    <!-- Middle left toe -->
    <ellipse cx="58" cy="95" rx="10" ry="13" transform="rotate(-35 58 95)"/>
    <!-- Middle right toe -->
    <ellipse cx="142" cy="95" rx="10" ry="13" transform="rotate(35 142 95)"/>
  </g>
  <!-- BW initials -->
  <text x="100" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#00BFA5" text-anchor="middle" letter-spacing="1">BW</text>
</svg>
